# lazysql connections — mirror mycli/.myclirc [alias_dsn].
# Passwords come from pass (cli/db/<profile>) via db_pass_urlenc, never stored here.

[[database]]
Name = "TAPI prod"
Provider = "mysql"
DBName = "travelapi_prod"
URL = "mysql://travelapi_prod:${password}@127.0.0.1:3307/travelapi_prod"
ReadOnly = true
Commands = [{ Command = "db_pass_urlenc tapi", SaveOutputTo = "password" }]

